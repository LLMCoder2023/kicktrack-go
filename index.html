<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KickTrack Go</title>
<meta name="description" content="KickTrack Go. Privacy policy and support.">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://kicktrackgo.com/">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f6f7f9;
    --text: #1c1e21;
    --muted: #5c6470;
    --rule: #e2e5ea;
    --accent: #1f6feb;
    --measure: 42rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f25;
      --text: #e6e8eb;
      --muted: #9aa3b0;
      --rule: #2b2f37;
      --accent: #6ea8fe;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 3rem 1.25rem 5rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: var(--measure); margin: 0 auto; }
  header { border-bottom: 1px solid var(--rule); padding-bottom: 1.5rem; margin-bottom: 2.5rem; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 0.75rem; letter-spacing: -0.02em; }
  .publisher { color: var(--muted); margin: 0.2rem 0 0; font-size: 0.925rem; }
  p { margin: 0 0 1rem; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { margin-bottom: 0.75rem; }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { text-decoration: none; }
  .note {
    margin: 2.5rem 0 0;
    padding: 1rem 1.15rem;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .note p { margin: 0; }
  .note strong { color: var(--text); font-weight: 600; }
  .app-icon { display: block; width: 72px; height: 72px; border-radius: 16px; margin: 0 0 1rem; }
  .shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem; margin: 0.5rem 0 1.5rem; }
  .shots figure { margin: 0; }
  .shots a { display: block; }
  .shots img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--rule); }
  .shots figcaption { color: var(--muted); font-size: 0.8rem; line-height: 1.35; margin-top: 0.4rem; }
</style>
</head>
<body>
<main>

  <header>
    <img class="app-icon" src="images/icon/app-store-icon.png" width="1024" height="1024" alt="KickTrack Go app icon">
    <h1>KickTrack Go</h1>
  </header>

  <div class="shots">
    <figure>
      <a href="images/screenshots/19-play-running-waveform.png"><img src="images/screenshots/19-play-running-waveform.png" width="1320" height="2868" loading="lazy" alt="Play screen with a track running"></a>
      <figcaption>Play</figcaption>
    </figure>
    <figure>
      <a href="images/screenshots/22-timing-routine-timeline.png"><img src="images/screenshots/22-timing-routine-timeline.png" width="1320" height="2868" loading="lazy" alt="Timing screen showing the routine timeline and pre-roll"></a>
      <figcaption>Timing</figcaption>
    </figure>
    <figure>
      <a href="images/screenshots/27-sound-advanced-5-band-eq.png"><img src="images/screenshots/27-sound-advanced-5-band-eq.png" width="1320" height="2868" loading="lazy" alt="Sound screen with the 5-band EQ"></a>
      <figcaption>Sound</figcaption>
    </figure>
  </div>

  <ul>
    <li><a href="privacy.html">Privacy policy</a></li>
    <li><a href="support.html">Support</a></li>
  </ul>

  <div class="note">
    <p><strong>Always test your setup thoroughly before live use.</strong>
    Run each track all the way through on the speaker or PA you'll compete on,
    at performance volume, and stand through the pre-roll — so nothing is a
    surprise on the floor.</p>
  </div>

</main>
</body>
</html>
